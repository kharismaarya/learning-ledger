<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning Ledger</title>
<!-- Local edition: no network needed. Data is kept in this browser (localStorage key "learning-ledger"). -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
.io{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.io .state{font-size:12px;color:var(--muted)}
.io .state.warn{color:var(--warn);font-weight:600}
.banner .row{margin-top:8px}
/* Layout: a resume column (goal, next step, milestones) beside a working column (quick add, log rail). Stacks on phones, resume first. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --line:#D6D9D2;
  --ink:#18201D; --muted:#5E6762; --faint:#8B938E;
  --accent:#2747C9; --accent-soft:#E3E8FB; --next:#B45F06; --next-soft:#FBEEDD;
  --t-source:#2F6FB5; --t-insight:#7A4BB8; --t-question:#B7791F; --t-build:#2E8B57; --t-milestone:#18201D;
  --good:#2E8B57; --warn:#B7791F; --bad:#B4362D;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1A1F1C; --sunk:#222825; --line:#323A36;
  --ink:#E8ECE9; --muted:#A3ACA7; --faint:#77807B;
  --accent:#8EA4FF; --accent-soft:#232C4D; --next:#F0A04B; --next-soft:#3A2A17;
  --t-source:#6FA8E8; --t-insight:#B596F0; --t-question:#E3AE55; --t-build:#5FC08A; --t-milestone:#E8ECE9;
  --good:#5FC08A; --warn:#E3AE55; --bad:#EE7A70; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1A1F1C; --sunk:#222825; --line:#323A36;
  --ink:#E8ECE9; --muted:#A3ACA7; --faint:#77807B;
  --accent:#8EA4FF; --accent-soft:#232C4D; --next:#F0A04B; --next-soft:#3A2A17;
  --t-source:#6FA8E8; --t-insight:#B596F0; --t-question:#E3AE55; --t-build:#5FC08A; --t-milestone:#E8ECE9;
  --good:#5FC08A; --warn:#E3AE55; --bad:#EE7A70; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:20px}
.brand span{color:var(--faint);font-size:13px}
.tracks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:16px}

/* goal */
.goal h2.outcome{font-size:clamp(20px,2.6vw,26px);line-height:1.2}
.goal .why{color:var(--muted);max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fact{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact b{font-family:var(--f-display);font-size:20px;font-weight:600}
.fact small{color:var(--muted);font-size:12px}
.pace{display:flex;flex-direction:column;gap:6px}
.bar{position:relative;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--next)}
.pace-legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}

/* next step */
.next{background:var(--next-soft);border:1px solid color-mix(in srgb,var(--next) 35%,transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.next .label{color:var(--next)}
.next input{width:100%;background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--next) 50%,transparent);padding:4px 0;font-size:16px;font-weight:500}
.next input:focus{outline:none;border-bottom-style:solid}
.lastseen{font-size:13px;color:var(--muted)}
.answer{background:color-mix(in srgb,var(--good) 9%,transparent);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;margin-top:2px}
.answer .label{color:var(--good);display:flex;justify-content:space-between;align-items:center;gap:8px}
.answer .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.link-btn{align-self:flex-start;border:0;background:transparent;padding:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.ans-form{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.qlist li{flex-wrap:wrap}
.qlist .ans-form{flex-basis:100%}
.ach{display:flex;flex-direction:column;gap:6px;padding:10px 0 4px;border-top:1px dashed color-mix(in srgb,var(--next) 35%,transparent)}
.ach ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ach li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline;font-size:14px}
.ach li::before{content:"✓";color:var(--good);font-weight:700}
.ach .x{overflow-wrap:anywhere}
.ach .x small{display:block;font-size:12px;color:var(--muted)}
.ach .more{align-self:flex-start;border:0;background:transparent;padding:0;color:var(--next);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.ach .none{font-size:13px;color:var(--muted)}
.now-ms{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ms .ns{font-size:13px;color:var(--next);margin-top:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;padding-top:18px}
.chk input{width:16px;height:16px;accent-color:var(--good)}
.mtag{font:inherit;font-size:11px;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:0 8px;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms .mt-btn{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.ms .mt-btn:hover{text-decoration:underline;text-decoration-color:var(--faint)}
.ms .mt-btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.ms li:has(.mt-btn[aria-pressed="true"]){background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:8px}
.ms .logged{color:var(--accent)}
.ms-detail{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ms-detail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ms-detail li{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;padding:0;border:0}
.ms-detail .t{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ms-detail .x{overflow-wrap:anywhere}

/* milestones */
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ms li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ms li:first-child{border-top:0}
.ms .state{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1}
.ms li[data-s="doing"] .state{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 50% 100%)}
.ms li[data-s="done"] .state{border-color:var(--good);background:var(--good);color:var(--surface)}
.ms li[data-s="done"] .mt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ms .mt{min-width:0;overflow-wrap:anywhere}
.ms .due{font-size:12px;color:var(--faint)}
.ms .acts{display:flex;gap:4px}
.icon-btn{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:12px}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn.danger{color:var(--bad)}
.ms-add{display:flex;gap:8px;flex-wrap:wrap}
.ms-add input[type=text]{flex:1 1 180px;min-width:0}
.ms-add input[type=date]{flex:0 0 auto}

/* forms */
.field{display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=url],input[type=date],textarea,input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#0E1330}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1330}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > .field{flex:1 1 160px;min-width:0}

/* quick add */
.types{display:flex;flex-wrap:wrap;gap:6px}
.type{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.type .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.type[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));font-weight:600}
.hint{font-size:12px;color:var(--faint)}

/* log */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.log-search{order:-1}
.log{display:flex;flex-direction:column}
.month{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 0 6px 92px}
.entry{display:grid;grid-template-columns:72px 20px minmax(0,1fr);gap:0 0;position:relative}
.entry .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:11px;text-align:right;padding-right:12px}
.entry .rail{position:relative}
.entry .rail::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line)}
.entry .rail::after{content:"";position:absolute;left:4px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.entry[data-t="milestone"] .rail::after{border-radius:2px;transform:rotate(45deg);background:var(--c)}
.entry .body{padding:8px 0 12px 10px;min-width:0;display:flex;flex-direction:column;gap:4px}
.entry .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.entry a{color:var(--accent);overflow-wrap:anywhere;font-size:13px}
.entry .acts{margin-left:auto;display:flex;gap:2px;opacity:.65}
.entry:hover .acts,.entry:focus-within .acts{opacity:1}
.resolved{font-size:11px;color:var(--good);font-weight:600}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:left;display:flex;flex-direction:column;gap:6px}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.qlist li span{min-width:0;overflow-wrap:anywhere}

/* topics */
.topics{display:flex;flex-direction:column}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.topic:first-child{border-top:0}
.topic-btn{border:0;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;padding:6px 8px;border-radius:8px}
.topic-btn:hover{background:var(--sunk)}
.topic-btn[aria-pressed="true"]{background:var(--accent-soft)}
.topic-name{font-weight:600;overflow-wrap:anywhere}
.topic-meta{font-size:12px;color:var(--muted)}
.topic-detail{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.topic-detail ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.topic-detail a{color:var(--accent);overflow-wrap:anywhere}
.topic-detail .hint{margin:0}
.ttag{font:inherit;font-size:11px;color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 8px;cursor:pointer;border:0}
.ttag.none{color:var(--bad);cursor:default}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.group-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:16px 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.group-h:first-child{padding-top:4px}
.group-h h3{font-size:15px}
.group-h span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.req{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:10}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.claude-tip{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.claude-tip code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
@media (max-width:480px){
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fact b{font-size:17px}
  .entry{grid-template-columns:52px 20px minmax(0,1fr)}
  .entry .d{font-size:11px;padding-right:8px}
  .month{padding-left:72px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Learning Ledger</h1><span id="savedState" class="mono"></span></div>
    <nav class="tracks" id="trackBar" aria-label="Learning tracks"></nav>
    <div class="io">
      <span class="state" id="backupState"></span>
      <button class="btn" type="button" id="exportBtn">Export</button>
      <button class="btn" type="button" id="importBtn">Import</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="grid">
    <div class="col">
      <section class="panel goal" id="goalPanel" aria-label="Goal"></section>
      <section class="next" id="nextPanel" hidden>
        <span class="label" id="nowLabel">Now working on</span>
        <div class="now-ms" id="nowMs"></div>
        <div class="ach" id="nowAch" hidden></div>
        <div class="field" id="nextField">
          <label class="label" for="nextInput">Next step</label>
          <input type="text" id="nextInput" placeholder="What's the very next thing you'll do for this milestone?">
        </div>
        <span class="lastseen" id="lastSeen"></span>
      </section>
      <section class="panel" id="msPanel" hidden>
        <div class="panel-head"><h2>Milestones</h2><span class="label" id="msCount"></span></div>
        <ul class="ms" id="msList"></ul>
        <form class="ms-add" id="msForm">
          <input type="text" id="msTitle" placeholder="Add a milestone (a capability, not a task)" aria-label="New milestone">
          <input type="date" id="msDue" aria-label="Milestone target date">
          <button class="btn" type="submit">Add</button>
        </form>
      </section>
      <section class="panel" id="qPanel" hidden>
        <div class="panel-head"><h2>Open questions</h2><span class="label" id="qCount"></span></div>
        <ul class="qlist" id="qList"></ul>
      </section>
    </div>

    <div class="col">
      <section class="panel" id="topicPanel" hidden>
        <div class="panel-head"><h2>Topics</h2><span class="label" id="topicCount"></span></div>
        <div class="topics" id="topicList"></div>
        <form class="ms-add" id="topicForm">
          <input type="text" id="topicName" placeholder="New topic, e.g. HTML & CSS" aria-label="New topic name">
          <button class="btn" type="submit">Add topic</button>
        </form>
      </section>

      <section class="panel" id="addPanel" hidden>
        <div class="panel-head"><h2>Log something</h2><span class="hint">Takes 5 seconds. Future you will thank you.</span></div>
        <form id="addForm" style="display:flex;flex-direction:column;gap:12px">
          <div class="row">
            <div class="field"><label class="label" for="addTopic">Topic <span class="req">*</span></label><select id="addTopic"></select></div>
            <div class="field" id="newTopicField" hidden><label class="label" for="addTopicNew">New topic name</label><input type="text" id="addTopicNew" placeholder="e.g. Git & GitHub"></div>
          </div>
          <div class="types" id="typePick" role="group" aria-label="Entry type"></div>
          <div class="row" style="align-items:center" id="addMsRow" hidden>
            <div class="field"><label class="label" for="addMs">Progress toward milestone <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)">optional</span></label><select id="addMs"></select></div>
            <label id="addDoneWrap" class="chk" hidden><input type="checkbox" id="addDone"> This completes the milestone</label>
          </div>
          <div class="field">
            <textarea id="addText" placeholder="What did you get from it? One line is enough." aria-label="What you learned or did"></textarea>
          </div>
          <div class="row">
            <div class="field"><input type="url" id="addUrl" placeholder="Link (video, article, chat, repo) — optional" aria-label="Link"></div>
            <div class="field" style="flex:0 0 auto"><input type="date" id="addDate" aria-label="Date"></div>
            <button class="btn primary" type="submit" id="addBtn">Add to log</button>
          </div>
        </form>
        <div class="claude-tip">Saved in this browser as you go. Use <code>Export</code> now and then to keep a backup file you can import anywhere.</div>
      </section>

      <section class="panel" id="logPanel" hidden>
        <div class="panel-head">
          <div style="display:flex;align-items:baseline;gap:10px"><h2>Log</h2><span class="label" id="logCount"></span></div>
          <div class="seg" id="viewSeg" role="group" aria-label="Log view"><button type="button" data-v="time">Timeline</button><button type="button" data-v="topic">By topic</button><button type="button" data-v="milestone">By milestone</button></div>
        </div>
        <input type="search" id="logSearch" class="log-search" placeholder="Search the log: text, links or topic names" aria-label="Search the log">
        <div class="filters" id="filters"></div>
        <div class="log" id="log"></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
const TYPES=[
  {k:"source",n:"Source",c:"var(--t-source)"},
  {k:"insight",n:"Insight",c:"var(--t-insight)"},
  {k:"question",n:"Question",c:"var(--t-question)"},
  {k:"build",n:"Build",c:"var(--t-build)"},
  {k:"milestone",n:"Milestone",c:"var(--t-milestone)"}
];
const TMAP=Object.fromEntries(TYPES.map(t=>[t.k,t]));
const PICK=TYPES.filter(t=>t.k!=="milestone"); /* milestone entries are created by ticking a milestone done */

/* ---------- milestones ---------- */
const NEXTS={todo:"doing",doing:"done",done:"todo"};
const msLog=m=>tEntries().filter(x=>x.milestoneId===m.id&&x.type!=="milestone");
async function setStatus(m,ns){
  const was=m.status||"todo";
  if(!await write(()=>S.db.doc("milestones/"+m.id).update({status:ns,doneAt:ns==="done"?today():""})))return;
  if(ns==="done"){
    await write(()=>S.db.collection("entries").doc("ms-"+m.id).set({trackId:m.trackId,type:"milestone",milestoneId:m.id,topicId:"",text:"Reached milestone: "+m.title,url:"",date:today(),createdAt:Date.now()}));
    const others=tMs().filter(x=>x.id!==m.id);
    if(!others.some(x=>x.status==="doing")){const n=others.find(x=>(x.status||"todo")==="todo");
      if(n&&await write(()=>S.db.doc("milestones/"+n.id).update({status:"doing"}))){S.focusNow=true;renderNext();toast(`Milestone reached. What's the first step for the next one?`);return}}
    toast("Milestone reached and logged");
  }else if(was==="done"){await write(()=>S.db.doc("entries/ms-"+m.id).delete())}
}

      el("div",{class:"mt"},el("button",{class:"mt-btn","aria-pressed":String(S.msFilter===m.id),title:S.msFilter===m.id?"Show all log entries":"Show only this milestone's log entries",onclick:()=>{const on=S.msFilter===m.id;S.msFilter=on?null:m.id;render();if(!on&&matchMedia("(max-width:860px)").matches)$("logPanel").scrollIntoView({block:"start"})}},m.title),

        S.confirmDel===delKey?el("button",{class:"icon-btn",onclick:()=>{S.confirmDel=null;renderMs()}},"Keep"):el("button",{class:"icon-btn",onclick:()=>{S.confirmDel=delKey;renderMs()}},"Delete")
      ):el("span")

  });

  if(existing)return existing.id;
  const ref=S.db.collection("topics").doc();
  return (await write(()=>ref.set({trackId,name,createdAt:Date.now()})))?ref.id:null;
}

/* ---------- local store ----------
   Same small API the claude.ai version used (collection/doc, set/update/delete, onSnapshot),

const KEY="learning-ledger",BKEY="learning-ledger:lastExport",COLS=["tracks","topics","milestones","entries"];
const LocalDB=(()=>{

  const norm=d=>{const o=blank();COLS.forEach(c=>{o[c]=Array.isArray(d&&d[c])?d[c].filter(r=>r&&typeof r.id==="string"):[]});return o};
  let memoryOnly=false,state;

  const subs=Object.fromEntries(COLS.map(c=>[c,new Set()]));
  const snap=c=>({docs:state[c].map(r=>{const{id,...rest}=r;return{id,data:()=>JSON.parse(JSON.stringify(rest))}})});
  const notify=cs=>queueMicrotask(()=>cs.forEach(c=>subs[c].forEach(cb=>cb(snap(c)))));
  const persist=()=>{if(memoryOnly)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){throw{code:e&&e.name==="QuotaExceededError"?"quota_exceeded":"unavailable",message:String(e)}}};
  const commit=(c,before)=>{try{persist()}catch(e){state[c]=before;throw e}notify([c])};
  const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(15)),b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join("").slice(0,20);
  const ref=(c,id)=>({id,path:c+"/"+id,
    async set(data){const before=state[c],row={...JSON.parse(JSON.stringify(data)),id};const i=before.findIndex(r=>r.id===id);state[c]=i<0?[...before,row]:before.map((r,j)=>j===i?row:r);commit(c,before)},
    async update(data){const before=state[c],i=before.findIndex(r=>r.id===id);if(i<0)throw{code:"invalid_argument",message:"No such record: "+c+"/"+id};

    async delete(){const before=state[c];state[c]=before.filter(r=>r.id!==id);commit(c,before)}});

    doc:id=>ref(c,id||newId()),

  return{
    collection:coll,
    doc:path=>{const[c,id]=path.split("/");coll(c);return ref(c,id)},
    get memoryOnly(){return memoryOnly},
    counts:()=>({tracks:state.tracks.length,entries:state.entries.length}),
    exportData:()=>({app:"learning-ledger",schema:1,exportedAt:new Date().toISOString(),...Object.fromEntries(COLS.map(c=>[c,state[c]]))}),

  };

  const err=LocalDB.validate(d);if(err){showBanner(err);return}
  const cur=LocalDB.counts(),inc={tracks:d.tracks.length,entries:d.entries.length};
  const go=()=>{try{LocalDB.replaceAll(d);S.cur=null;S.topicFilter=null;S.msFilter=null;hideBanner();toast(`Imported ${plural(inc.tracks,"track")} and ${plural(inc.entries,"entry","entries")}`)}catch(x){showBanner("Couldn't import: this browser's storage is full or blocked.")}};
  if(!cur.tracks&&!cur.entries){go();return}
  showBanner(`Replace what's in this browser (${plural(cur.tracks,"track")}, ${plural(cur.entries,"entry","entries")}) with "${f.name}" (${plural(inc.tracks,"track")}, ${plural(inc.entries,"entry","entries")})? Export first if you want to keep the current data.`,
    [el("button",{class:"btn primary",onclick:go},"Replace"),el("button",{class:"btn",onclick:hideBanner},"Cancel")]);
});
function showBanner(msg,btns){const b=$("banner");b.replaceChildren(el("div",null,msg),btns?el("div",{class:"row"},btns):el("div",{class:"row"},el("button",{class:"btn",onclick:hideBanner},"OK")));b.hidden=false;b.scrollIntoView({block:"nearest"})}
function hideBanner(){const b=$("banner");b.hidden=true;b.replaceChildren();if(LocalDB.memoryOnly)warnMemory()}
function warnMemory(){const b=$("banner");b.textContent="This browser is blocking storage for this page, so changes will be lost when you close it. Use Export to keep them, or open the page through the start script.";b.hidden=false}

/* ---------- boot ---------- */
renderTypes();render();
S.db=LocalDB;S.canWrite=true;
if(LocalDB.memoryOnly)warnMemory();
const sub=(col,key,flag)=>LocalDB.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[flag]=true;render();renderBackupState()});
sub("tracks","tracks","t");sub("entries","entries","e");sub("milestones","ms","m");sub("topics","topics","p");
})();
</script>
